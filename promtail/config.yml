server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Flask Application Logs
  - job_name: flask_app
    static_configs:
      - targets:
          - localhost
        labels:
          job: blackbox_ctf
          service: blackbox
          __path__: /var/log/blackbox/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            event: event
            user_id: user_id
            team_id: team_id
            challenge_id: challenge_id
            ip: ip
      - labels:
          level:
          event:
      - timestamp:
          source: timestamp
          format: RFC3339

  # Nginx Access Logs
  - job_name: nginx_access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: nginx
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - json:
          expressions:
            status: status
            remote_addr: remote_addr
            request: request
            time_local: time_local
      - labels:
          status:
      # We could parse time_local here, but leaving to Loki defaults if tricky with Nginx format

  # Nginx Error Logs
  - job_name: nginx_error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: nginx
          level: error
          __path__: /var/log/nginx/error.log

  # Docker Container Logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
      - source_labels: ['__meta_docker_container_name']
        regex: '/blackbox-(.*)'
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_ctf_challenge']
        regex: 'true'
        target_label: 'service'
        replacement: 'challenge'
    pipeline_stages:
      - docker: {}
